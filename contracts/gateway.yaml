schema_version: v1

gateway:
  adapter: apisix
  mode: standalone
  environment: uat
  domains:
    - ai.onwalk.net
    - direct.ai.onwalk.net
  runtime_config_backend: gitops-file
  etcd: false

upstreams:
  - id: kong
    protocol: http
    host: 127.0.0.1
    port: 8000
    public: false
  - id: apisix
    protocol: http
    host: 127.0.0.1
    port: 9080
    public: false
  - id: new-api
    protocol: http
    public: false
    nodes:
      - host: 127.0.0.1
        port: 3000
        weight: 100
    schedule:
      algorithm: round-robin
      connect_timeout_ms: 3000
      read_timeout_ms: 120000
  - id: litellm
    protocol: http
    public: false
    nodes:
      - host: 127.0.0.1
        port: 4000
        weight: 100
    schedule:
      algorithm: round-robin
      connect_timeout_ms: 3000
      read_timeout_ms: 120000

tenants:
  - id: personal
    enabled: false
    allowed_models:
      - claude-opus-4-5-20251101
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-opus-5
      - claude-sonnet-4-5-20250929
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-sonnet-5-5
      - codex-auto-review
      - gemini-3-flash
      - gemini-3.1-flash-lite
      - gemini-3.5-flash-lite
      - gemini-pro-agent
      - gpt-5.5
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-6-astra
      - gpt-6-luna
      - gpt-6-sol
      - gpt-6.1-sol
    rate_limit_per_minute: 60

routes:
  - id: ai-new-api
    hosts: [ai.onwalk.net]
    paths: [/v1]
    upstream: new-api
    tenant_ref: personal
    auth:
      mode: key-auth

  - id: ai-litellm
    hosts: [direct.ai.onwalk.net]
    paths: [/v1]
    upstream: litellm
    tenant_ref: personal
    auth:
      mode: key-auth
