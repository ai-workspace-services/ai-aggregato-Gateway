profile: ai-gateway-v1
component: llm-modules-hub

# Non-sensitive module catalog. Credentials and health are runtime data.
modules:
  - id: subscription/cpa
    backend: new-api-cpa
    protocols: [openai-chat, openai-responses, anthropic-messages]
    source: cpa
    lifecycle: local-oauth

  - id: official/litellm
    backend: litellm
    protocols: [openai-chat, openai-responses, anthropic-messages]
    source: official-provider
    lifecycle: vault-key

  - id: nvidia/openai-gpt-oss-20b
    backend: litellm
    provider: nvidia
    upstream_model: openai/gpt-oss-20b
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab

  - id: nvidia/nemotron-3.5-lightning-30b-a3b
    backend: litellm
    provider: nvidia
    upstream_model: nvidia/nemotron-3.5-lightning-30b-a3b
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab

  - id: nvidia/deepseek-v4.1-flash
    backend: litellm
    provider: nvidia
    upstream_model: deepseek-ai/deepseek-v4.1-flash
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab

  - id: nvidia/glm-5.3
    backend: litellm
    provider: nvidia
    upstream_model: z-ai/glm-5.3
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab

  - id: nvidia/glm-5.3-flash
    backend: litellm
    provider: nvidia
    upstream_model: z-ai/glm-5.3-flash
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab

  - id: local/ollama
    backend: litellm
    provider: ollama
    endpoint_ref: runtime-only
    protocols: [openai-chat]
    lifecycle: local-runtime
    status: optional

  - id: ollama-cloud/verified
    backend: litellm
    provider: ollama
    endpoint: https://ollama.com/v1
    endpoint_ref: vault
    protocols: [openai-chat]
    lifecycle: vault-key
    status: validated-home-lab-chat
    verified_models: ["gpt-oss:120b", "gpt-oss:20b", "gemma4:31b", nemotron-3-super, nemotron-3-ultra]

# Models passed by the 2026-10-07 Home-Lab minimum chat smoke test.
# The environment GitOps manifest is the deployment source of truth.
validated_models:
  - claude-opus-4-5-20251101
  - claude-opus-4-6
  - claude-opus-4-7
  - claude-opus-4-8
  - claude-opus-5
