profile: ai-gateway-v1
component: litellm

providers:
  - openai
  - anthropic
  - xai
  # Optional OpenAI-compatible modules. Enable only after the provider key
  # and model catalog have been verified in the target environment.
  - nvidia
  - amd

capabilities:
  retry: true
  timeout: true
  usage: true
  cost: true

upstream:
  logical_service: litellm
  bind_scope: private
  vault_secret_scope: kv/<env>/ai-aggregator/litellm/providers/{openai,anthropic,xai,nvidia,amd}
